; Copy this file to config.ini and fill in real values.
; config.ini is gitignored -- it holds live AWS credentials, never commit it.

[event]
; Change `name` per event -- it's just a label used on the Pi's own screen.
; `slug` is auto-generated the first time this event runs and saved back
; here; it's the unguessable ID actually used for the S3 path and gallery
; URL (base_url/?event=<slug>), so one event can't browse into another's
; photos. Leave slug blank to get a fresh one (e.g. when starting a new event).
name = MakerFaireMiami2026
slug =
title = Maker Faire Miami Photo Booth
hashtag = #MakerFaireMiami

[aws]
bucket = mariocruz-photobooth-gallery
region = us-east-1
access_key_id = YOUR_ACCESS_KEY_ID
secret_access_key = YOUR_SECRET_ACCESS_KEY

[website]
; The S3 static website endpoint printed by deploy/setup_aws.sh
base_url = http://mariocruz-photobooth-gallery.s3-website-us-east-1.amazonaws.com

[camera]
num_photos = 3
resolution_width = 1920
resolution_height = 1080
; Optional PNG overlay (logo) pasted onto each photo. Leave blank to skip.
logo_path = mtm.png
