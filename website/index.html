<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Booth Gallery</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <h1 id="event-title">Photo Booth Gallery</h1>
  <p id="event-subtitle" class="subtitle"></p>
</header>

<main>
  <div id="mine-banner" class="mine-banner" hidden>
    Your photos are ready — look for the <span class="badge">Yours</span> tag below.
  </div>
  <div id="status" class="status">Loading photos…</div>
  <div id="gallery" class="gallery"></div>
</main>

<footer class="site-footer">
  <p>Scan the QR code at the booth to come back here anytime.</p>
</footer>

<script src="app.js"></script>
</body>
</html>
